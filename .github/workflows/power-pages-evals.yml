name: power-pages-evals

# BRANCH-ONLY EXPERIMENT: do not merge. Runs one job per case, model and effort
# with a personal fine-grained PAT (Account > Copilot Requests) stored as
# PP_EVAL_COPILOT_TOKEN. The dashboard never reads these runs: it accepts only
# main-branch runs, and these artifacts use a separate pp-eval-experiment- prefix.
# PAT auth: https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/install-copilot-cli#authenticating-with-a-personal-access-token
on:
    workflow_dispatch:
        inputs:
            skill:
                description: "Skill with a Vally suite, or all available suites"
                default: setup-auth
                required: true
                type: string
            runs:
                description: "Repeats per case and arm; start with 1 for human calibration"
                default: "1"
                type: choice
                options: ["1", "3", "5"]
            models:
                description: "Comma-separated model IDs checked against the token's live catalog"
                default: "claude-opus-5.5,claude-opus-4.8,claude-sonnet-5.5,gpt-6.1-astra,gpt-6.1-sol"
                type: string
            reasoning_effort:
                description: "Agent reasoning effort; max resolves to each model's highest supported effort"
                default: medium
                type: choice
                options: [medium, low, high, xhigh, max, none]
            judge_model:
                description: "Optional judge override; blank uses GPT-6.1 Sol, and Opus 5.5 to judge GPT-6.1 Sol"
                default: ""
                type: string
            judge_reasoning_effort:
                description: "Judge reasoning effort"
                default: medium
                type: choice
                options: [medium, low, high, xhigh, max, none]

permissions:
    contents: read

jobs:
    select:
        # The PAT is a personal repository secret, and this experiment has no
        # admin-created protected environment. Run only on the experiment branch
        # when its owner dispatches it. The PAT should grant only Copilot Requests.
        if: github.ref == 'refs/heads/users/priyanshu92/power-pages-evaluations' && github.actor == 'priyanshu92' && github.triggering_actor == 'priyanshu92'
        runs-on: ubuntu-24.04
        outputs:
            matrix: ${{ steps.select.outputs.matrix }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: install pinned evaluation dependencies
              run: npm ci --prefix evals/runtime --registry=https://packagefeedproxy.microsoft.io/npm/ --ignore-scripts --no-audit --no-fund
            - id: select
              env:
                  EVAL_TOKEN: ${{ secrets.PP_EVAL_COPILOT_TOKEN }}
                  SELECTED_SKILL: ${{ inputs.skill }}
                  MODELS: ${{ inputs.models }}
                  JUDGE_MODEL: ${{ inputs.judge_model }}
                  REASONING_EFFORT: ${{ inputs.reasoning_effort }}
                  JUDGE_REASONING_EFFORT: ${{ inputs.judge_reasoning_effort }}
              run: node evals/runtime/experiment-matrix.mjs

    evaluate:
        needs: select
        if: github.ref == 'refs/heads/users/priyanshu92/power-pages-evaluations' && github.actor == 'priyanshu92' && github.triggering_actor == 'priyanshu92'
        name: ${{ matrix.skill }}/${{ matrix.case }} ${{ matrix.model }} ${{ matrix.reasoningEffort }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.select.outputs.matrix) }}
        # Playwright 1.58.2 cannot install Chromium on Ubuntu 26.04.
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        permissions:
            contents: read
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_POWER_PAGES_OPTOUT: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: install pinned evaluation dependencies
              run: npm ci --prefix evals/runtime --registry=https://packagefeedproxy.microsoft.io/npm/ --ignore-scripts --no-audit --no-fund
            - name: install browser
              run: node evals/runtime/node_modules/playwright/cli.js install --with-deps chromium
            - name: configure Linux Chromium sandbox
              if: runner.os == 'Linux'
              run: bash evals/runtime/setup-linux-chromium-sandbox.sh
            - name: measure paired offline trials
              env:
                  # Scoped to inference only, never package installation or agent tools.
                  GITHUB_TOKEN: ${{ secrets.PP_EVAL_COPILOT_TOKEN }}
                  SKILL: ${{ matrix.skill }}
                  CASE: ${{ matrix.case }}
                  RUNS: ${{ inputs.runs }}
                  MODEL: ${{ matrix.model }}
                  JUDGE_MODEL: ${{ matrix.judgeModel }}
                  REASONING_EFFORT: ${{ matrix.reasoningEffort }}
                  JUDGE_REASONING_EFFORT: ${{ matrix.judgeReasoningEffort }}
              run: node evals/runtime/run.mjs run --skill "$SKILL" --case "$CASE" --runs "$RUNS" --model "$MODEL" --judge-model "$JUDGE_MODEL" --reasoning-effort "$REASONING_EFFORT" --judge-reasoning-effort "$JUDGE_REASONING_EFFORT" --out evals/reports/action
            # Refuse to upload if the PAT or any GitHub token shape appears in evidence.
            - name: check evidence for credentials
              id: credential-check
              if: ${{ always() }}
              env:
                  GITHUB_TOKEN: ${{ secrets.PP_EVAL_COPILOT_TOKEN }}
              run: node evals/runtime/evidence.mjs check evals/reports/action
            - name: explain failed checks
              if: ${{ always() && steps.credential-check.outcome == 'success' }}
              run: node evals/runtime/evidence.mjs report evals/reports/action >> "$GITHUB_STEP_SUMMARY"
            - name: upload grading evidence
              if: ${{ always() && steps.credential-check.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: pp-eval-experiment-${{ matrix.skill }}--${{ matrix.case }}--${{ matrix.model }}--${{ matrix.reasoningEffort }}
                  path: evals/reports/action
                  include-hidden-files: true
                  if-no-files-found: warn
                  retention-days: 30
