# Functional tests for the deterministic Canvas/MSAPP extraction and adaptation
# pipeline. The OS matrix catches path casing, separator, and filesystem drift.
name: mobile-apps-script-tests

on:
    pull_request:
        branches:
            - main
        paths:
            - "plugins/mobile-apps/scripts/**"
            - "plugins/mobile-apps/shared/samples/scripts/**"
            - "plugins/mobile-apps/shared/references/canvas-to-native-mapping.md"
            - "plugins/mobile-apps/shared/references/powerfx-table-operations.md"
            - "plugins/mobile-apps/skills/modernize-canvas-app/**"
            - "plugins/mobile-apps/skills/create-mobile-app/SKILL.md"
            - "plugins/mobile-apps/skills/create-mobile-app/mobile-plugin-handoff-contract.md"
            - "plugins/mobile-apps/agents/screen-builder.md"
            - "evals/mobile-apps/modernize-canvas-app/**"
            - ".github/workflows/mobile-apps-script-tests.yml"

jobs:
    test-mobile-app-scripts:
        name: test-mobile-app-scripts (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: setup-node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: syntax-check-quality-scripts
              shell: bash
              run: |
                  node --check plugins/mobile-apps/scripts/extract-msapp-brief.cjs
                  node --check plugins/mobile-apps/scripts/extract-msapp-brief.v2.cjs
                  node --check plugins/mobile-apps/scripts/adapt-app-brief-for-mobile-plugin.js
                  node --check plugins/mobile-apps/scripts/validate-mobile-plugin-input.js
                  node --check plugins/mobile-apps/scripts/import-mobile-plugin-input.js
                  node --check plugins/mobile-apps/scripts/render-mobile-migration-report.js
                  node --check plugins/mobile-apps/scripts/lib/modernizer-paths.js
                  node --check plugins/mobile-apps/scripts/lib/behavior-contract.js
                  node --check plugins/mobile-apps/scripts/lib/workflow-plan.js
                  node --check plugins/mobile-apps/shared/samples/scripts/check-behavior-coverage.js
                  node --check plugins/mobile-apps/shared/samples/scripts/check-pcf-coverage.js
                  node --check plugins/mobile-apps/shared/samples/scripts/check-workflow-coverage.js
                  node --check plugins/mobile-apps/shared/samples/scripts/check-conversion-scaffolding.js
                  node --check plugins/mobile-apps/shared/samples/scripts/check-i18n-keys.js
                  node --check plugins/mobile-apps/shared/samples/scripts/generate-asset-binding.js

            - name: run-mobile-app-conversion-tests
              shell: bash
              run: node --test plugins/mobile-apps/scripts/tests/msapp-conversion.test.cjs
