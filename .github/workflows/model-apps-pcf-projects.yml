# PCF project CI is deliberately separate from model-apps-script-tests.yml.
# These jobs need npm registry access for generated project installs; isolating
# them keeps a transient registry outage from failing the dependency-free unit
# matrix for unrelated model-apps changes.
name: model-apps-pcf-projects

on:
    pull_request:
        branches:
            - main
        paths:
            - "plugins/model-apps/pcf/**"
            - "plugins/model-apps/scripts/pcf-*.js"
            - "plugins/model-apps/scripts/lib/pcf-*.js"
            - "plugins/model-apps/scripts/lib/node-tool.js"
            - ".github/workflows/model-apps-pcf-projects.yml"

permissions:
    contents: read

jobs:
    test-model-apps-pcf-projects:
        name: test-model-apps-pcf-projects (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
        steps:
            - name: checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      plugins/model-apps/pcf/lock/standard/package-lock.json
                      plugins/model-apps/pcf/lock/virtual/package-lock.json

            - name: build-all-pcf-templates-and-recipes
              shell: bash
              run: node plugins/model-apps/scripts/pcf-ci-build.js --all

    package-model-apps-pcf-projects:
        name: package-model-apps-pcf-projects
        runs-on: ubuntu-latest
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        steps:
            - name: checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      plugins/model-apps/pcf/lock/standard/package-lock.json
                      plugins/model-apps/pcf/lock/virtual/package-lock.json

            - name: setup-dotnet
              uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: 8.0.x

            # Microsoft Learn documents the .NET tool package id as
            # Microsoft.PowerApps.CLI.Tool for cross-platform PAC CLI installs:
            # https://learn.microsoft.com/power-platform/developer/cli/introduction
            - name: install-pac-cli
              shell: bash
              run: |
                  dotnet tool install --global Microsoft.PowerApps.CLI.Tool
                  echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

            - name: package-pcf-managed-solutions
              shell: bash
              run: node plugins/model-apps/scripts/pcf-ci-build.js --package
