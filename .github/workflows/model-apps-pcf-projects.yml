# PCF project CI is deliberately separate from model-apps-script-tests.yml.
# These jobs need npm registry access for generated project installs; isolating
# them keeps a transient registry outage from failing the dependency-free unit
# matrix for unrelated model-apps changes.
name: model-apps-pcf-projects

on:
    pull_request:
        branches:
            - main
        paths:
            - "plugins/model-apps/pcf/**"
            - "plugins/model-apps/scripts/pcf-*.js"
            - "plugins/model-apps/scripts/lib/pcf-*.js"
            - "plugins/model-apps/scripts/lib/node-tool.js"
            # The package smoke starts pac through these two, so a change to either must run it.
            - "plugins/model-apps/scripts/lib/pac-exec.js"
            - "plugins/model-apps/scripts/lib/process-runner.js"
            - ".github/workflows/model-apps-pcf-projects.yml"

permissions:
    contents: read

jobs:
    test-model-apps-pcf-projects:
        name: test-model-apps-pcf-projects (${{ matrix.os }}, ${{ matrix.selector }})
        runs-on: ${{ matrix.os }}
        # ubuntu builds the full set in about five minutes and one Windows template takes roughly four to
        # nine; the cap turns a hung install or test into a failed check instead of a job that holds a
        # runner for the platform's six-hour default.
        timeout-minutes: 45
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        strategy:
            fail-fast: false
            matrix:
                # ubuntu builds every template and available recipe in one job. Windows builds each
                # template in its own job: every generated project pays a full `npm ci`, which is
                # I/O-bound on a Windows runner, and the four templates built one after another took
                # 25 minutes on one run and outlasted the 45-minute cap on another. Recipes only add
                # platform-independent control code on top of a template, so the templates cover the
                # scripts' path, shell and npm behavior on Windows. pcf-ci-build.test.js fails when a
                # catalog template has no Windows entry here.
                include:
                    - os: ubuntu-latest
                      selector: --all
                    - os: windows-latest
                      selector: --template dataset-standard
                    - os: windows-latest
                      selector: --template dataset-virtual
                    - os: windows-latest
                      selector: --template field-standard
                    - os: windows-latest
                      selector: --template field-virtual
        steps:
            - name: checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      plugins/model-apps/pcf/lock/standard/package-lock.json
                      plugins/model-apps/pcf/lock/virtual/package-lock.json

            - name: build-pcf-templates-and-recipes
              shell: bash
              # pcf-ci-build.js generates each project under os.tmpdir(). On a hosted Windows runner the
              # default TEMP is on C:, the OS disk, while runner.temp is on D:, the VM's local temporary
              # disk, which is faster for npm's many small file writes:
              # https://learn.microsoft.com/azure/virtual-machines/managed-disks-overview#temporary-disk
              # os.tmpdir() reads TEMP first on Windows and TMPDIR, then TMP, elsewhere, so ubuntu just
              # builds under its runner temp directory instead of /tmp.
              env:
                  TEMP: ${{ runner.temp }}
                  TMP: ${{ runner.temp }}
              run: node plugins/model-apps/scripts/pcf-ci-build.js ${{ matrix.selector }}

    package-model-apps-pcf-projects:
        name: package-model-apps-pcf-projects
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        steps:
            - name: checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      plugins/model-apps/pcf/lock/standard/package-lock.json
                      plugins/model-apps/pcf/lock/virtual/package-lock.json

            - name: setup-dotnet
              uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
              with:
                  dotnet-version: 8.0.x

            # Microsoft Learn documents the .NET tool package id as
            # Microsoft.PowerApps.CLI.Tool for cross-platform PAC CLI installs:
            # https://learn.microsoft.com/power-platform/developer/cli/introduction
            - name: install-pac-cli
              shell: bash
              run: |
                  dotnet tool install --global Microsoft.PowerApps.CLI.Tool
                  echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

            - name: package-pcf-managed-solutions
              shell: bash
              run: node plugins/model-apps/scripts/pcf-ci-build.js --package
