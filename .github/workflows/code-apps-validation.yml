name: code-apps-validation

on:
    pull_request:
        paths:
            - "plugins/code-apps/**"
            - ".agents/plugins/marketplace.json"
            - "marketplace.json"
            - ".claude-plugin/marketplace.json"
            - "scripts/validate-code-apps.js"
            - "scripts/validate-legacy-compatibility.js"
            - "scripts/tests/validate-legacy-compatibility.test.js"
            - ".github/workflows/code-apps-validation.yml"
    workflow_dispatch:

jobs:
    validate:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: Validate portable Code Apps package
              run: node scripts/validate-code-apps.js
            - name: Validate manifest compatibility
              run: node scripts/validate-legacy-compatibility.js
            - name: Check existing compatibility tests
              run: node --test scripts/tests/validate-legacy-compatibility.test.js
