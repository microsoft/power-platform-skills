# Weekly drift check for the PCF compatibility matrix. A failure here means the
# published PCF toolchain moved; update plugins/model-apps/pcf/compatibility-matrix.json
# and committed lockfiles using the procedure in plugins/model-apps/docs/pcf-design.md.
name: model-apps-pcf-matrix-drift

on:
    schedule:
        - cron: '17 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-pcf-matrix-drift:
        runs-on: ubuntu-latest
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        steps:
            - name: checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      plugins/model-apps/pcf/lock/standard/package-lock.json
                      plugins/model-apps/pcf/lock/virtual/package-lock.json

            - name: probe-published-pcf-toolchain
              shell: bash
              run: node plugins/model-apps/scripts/pcf-ci-build.js --all --latest
