# Functional unit tests for the model-apps plugin, across ubuntu × windows × macos
# and Node 20 × 22.
#
# Why a matrix: these scripts shell out to `pac`/`az`, build filesystem paths, and
# parse CLI output, so path-separator and shell differences are a real regression
# class that a single-OS run would miss. Both Node versions are covered because the
# plugin is developed on Node 22 while the repo's other test workflow pins Node 20 —
# a version-only failure should be attributable, not a mystery.
#
# Deliberately mirrors `power-pages-script-tests.yml` rather than extending it: the
# two plugins have independent path filters, so a change to one must not spend CI
# time on the other.
name: model-apps-script-tests

on:
    pull_request:
        branches:
            - main
        paths:
            - "plugins/model-apps/**"
            # The eval harness lives at the repo root but is owned by this plugin, so
            # an eval-only change must still trigger the eval job below.
            - "evals/model-apps/**"
            # The plugin ships physical copies of the shared telemetry library and the shared skill
            # workflows, and scripts/tests/telemetry-lib-copy.test.js fails when a copy drifts from its
            # source. That guard is only useful if a change to the SOURCE runs it too.
            - "shared/telemetry/**"
            - "shared/skills/**"
            # The telemetry region router is a verbatim copy of power-pages' (same drift test).
            - "plugins/power-pages/scripts/lib/telemetry/region/**"
            - ".github/workflows/model-apps-script-tests.yml"

# The jobs only read the checkout; the token needs nothing more, whatever the repository default is.
permissions:
    contents: read

# A new push to the same PR supersedes the run in flight: without this, all seven jobs of the old run
# kept going to completion for a result nobody reads.
concurrency:
    group: model-apps-script-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test-model-apps-scripts:
        name: test-model-apps-scripts (${{ matrix.os }}, node ${{ matrix.node }})
        runs-on: ${{ matrix.os }}
        # The suite takes about a minute on every runner. A test that hangs (a child process waiting on
        # stdin, say) would otherwise hold the job for the six-hour default.
        timeout-minutes: 20
        # Defense-in-depth: opt this CI job out of telemetry transmission so a test
        # that forgets to isolate emission can never POST to a real collector. The
        # plugin's committed ikey.json ships live (`disabled: false`) with real
        # production keys, so without this a stray emission would reach Kusto. Suppresses
        # TRANSMISSION only — the local diagnostic mirror is still written, so this
        # cannot change what the tests actually assert.
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                    - macos-latest
                node:
                    - 20
                    - 22
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}

            # run-tests.js is the plugin's own regression gate: it runs every
            # scripts/tests/*.test.js and exits non-zero on any failure. Invoking it
            # (rather than a bare `node --test`) keeps CI and the documented local
            # command identical, so a green PR means the same thing a green local run
            # does. The vendored SDK's own Jest suite is intentionally NOT run here —
            # it needs a Node-20-ABI `canvas` native module and the SDK source tree,
            # neither of which exists in this repo; the real-bundle contract tests in
            # scripts/tests/ cover the shipped bundle instead.
            - name: run-model-apps-script-tests
              shell: bash
              working-directory: plugins/model-apps
              run: node scripts/run-tests.js

    test-model-apps-evals:
        name: test-model-apps-evals
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            POWER_PLATFORM_SKILLS_TELEMETRY_MODEL_APPS_OPTOUT: "1"
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20

            # The eval harness lives at the repo root (evals/model-apps/**) but is
            # owned by this plugin, so it is gated by the same path filter. First the
            # unit tests of the scoring/fixture code: `evals/model-apps/tests/` holds
            # tests for code shared by the app-builder and genpage runners; a new test
            # directory has to be added here or it silently never runs. The routing tests
            # drive a FAKE agent process only; the real agent-in-the-loop routing eval runs
            # in model-apps-agent-evals.yml, because it needs model access and is not a gate.
            - name: run-model-apps-eval-tests
              shell: bash
              run: node --test evals/model-apps/tests/*.test.js evals/model-apps/app-builder/tests/*.test.js evals/model-apps/genpage/tests/*.test.js evals/model-apps/routing/tests/*.test.js

            # Then the runners themselves. They score the COMMITTED fixtures — captured
            # plans, transcripts and specs — offline, in about a second, with no
            # Dataverse org. Left to manual runs, four genpage fixtures fell out of step
            # with a newly required plan section and nothing noticed.
            - name: run-model-apps-eval-runners
              shell: bash
              run: |
                  node evals/model-apps/genpage/run-layer-1.js
                  node evals/model-apps/genpage/run-layer-2.js
                  node evals/model-apps/app-builder/run-app-builder.js
