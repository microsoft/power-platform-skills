name: code-apps-script-tests

on:
    pull_request:
        branches:
            - main
        paths:
            - "plugins/code-apps/**"
            - ".github/workflows/code-apps-script-tests.yml"
    push:
        branches:
            - main
        paths:
            - "plugins/code-apps/**"
            - ".github/workflows/code-apps-script-tests.yml"

permissions:
    contents: read

concurrency:
    group: code-apps-script-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test-code-apps-hooks:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: setup-node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
            - name: run-hook-tests
              run: node --test plugins/code-apps/scripts/tests/*.test.js
