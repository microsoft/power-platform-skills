# Weekly drift check for the PCF compatibility matrix. A failure here means the
# published PCF toolchain moved; update plugins/compatibility-matrix.json
# and committed lockfiles using the procedure in plugins/pcf/docs/pcf-design.md.
name: pcf-matrix-drift

on:
    schedule:
        - cron: '17 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-pcf-matrix-drift:
        runs-on: ubuntu-latest
        # Installs every template and recipe at the latest published versions; the cap turns a hung
        # install into a failed run instead of holding a runner for the six-hour default.
        timeout-minutes: 45
        env:
                    steps:
            - name: checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: setup-node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      plugins/lock/standard/package-lock.json
                      plugins/lock/virtual/package-lock.json

            - name: probe-published-pcf-toolchain
              shell: bash
              run: node plugins/pcf/scripts/pcf-ci-build.js --all --latest
