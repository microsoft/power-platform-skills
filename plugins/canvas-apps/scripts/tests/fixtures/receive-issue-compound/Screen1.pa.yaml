Screens:
    Screen1:
        Properties:
            OnVisible: =Reset(drpOperation); Reset(cmbAdjustItem)
        Children:
            - lblAdjustItem:
                Control: Classic/Label
                Properties:
                    Text: ="Inventory item"
            - cmbAdjustItem:
                Control: Classic/ComboBox
                Properties:
                    AllowEmptySelection: =true
                    DefaultSelectedItems: =[]
                    Items: =colInventory
            - lblOperation:
                Control: Classic/Label
                Properties:
                    Text: ="Operation"
            - drpOperation:
                Control: Classic/DropDown
                Properties:
                    AllowEmptySelection: =true
                    Default: =Blank()
                    Items: =["Receive", "Issue"]
            - lblAmount:
                Control: Classic/Label
                Properties:
                    Text: ="Amount"
            - txtAmount:
                Control: Classic/TextInput
                Properties:
                    Format: =TextFormat.Number
            - btnReceive:
                Control: Classic/Button
                Properties:
                    DisplayMode: =If(IsBlank(drpOperation.Selected.Value) || IsBlank(cmbAdjustItem.Selected.ID) || Not(Value(txtAmount.Text) > 0), DisplayMode.Disabled, DisplayMode.Edit)
                    OnSelect: =Set(varLastOperation, "Receive"); Set(varOldQuantity, LookUp(colInventory, ID = cmbAdjustItem.Selected.ID).Quantity); Set(varAmount, Value(txtAmount.Text)); Set(varExpectedQuantity, varOldQuantity + varAmount); Set(varLastMutation, Patch(colInventory, LookUp(colInventory, ID = cmbAdjustItem.Selected.ID), {Quantity: varOldQuantity + varAmount}))
            - btnIssue:
                Control: Classic/Button
                Properties:
                    DisplayMode: =If(IsBlank(drpOperation.Selected.Value) || IsBlank(cmbAdjustItem.Selected.ID) || Not(Value(txtAmount.Text) > 0), DisplayMode.Disabled, DisplayMode.Edit)
                    OnSelect: =Set(varLastOperation, "Issue"); Set(varOldQuantity, LookUp(colInventory, ID = cmbAdjustItem.Selected.ID).Quantity); Set(varAmount, Value(txtAmount.Text)); Set(varExpectedQuantity, varOldQuantity - varAmount); Set(varLastMutation, Patch(colInventory, LookUp(colInventory, ID = cmbAdjustItem.Selected.ID), {Quantity: varOldQuantity - varAmount}))
            - galInventory:
                Control: Gallery
                Properties:
                    Items: =colInventory
            - lblReceiptOperation:
                Control: Classic/Label
                Properties:
                    Text: =varLastOperation
            - lblReceiptOld:
                Control: Classic/Label
                Properties:
                    Text: =varOldQuantity
            - lblReceiptAmount:
                Control: Classic/Label
                Properties:
                    Text: =varAmount
            - lblReceiptExpected:
                Control: Classic/Label
                Properties:
                    Text: =varExpectedQuantity
            - lblReceiptActual:
                Control: Classic/Label
                Properties:
                    Text: =varLastMutation.Quantity
