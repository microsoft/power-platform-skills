<!DOCTYPE html>
<html lang="__SOURCE_LOCALE__" dir="__SOURCE_DIRECTION__">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>__PLAN_TITLE__ - __SITE_NAME__</title>
<style>
:root{
  --bg:#faf9f8;--surface:#fff;--surface2:#f3f2f1;--border:#e1dfdd;--text:#323130;
  --text-dim:#605e5c;--text-bright:#201f1e;--accent:#0078d4;--accent-bg:#0078d40a;
  --accent-border:#0078d425;--pass:#107c10;--pass-bg:#107c100a;--warn:#ca5010;
  --warn-bg:#ca50100a;--purple:#8764b8;--purple-bg:#8764b80a;
  --mono:'Cascadia Code','Consolas',monospace;
  --sans:'Segoe UI','Segoe UI Web (West European)',-apple-system,system-ui,sans-serif;
  --radius:8px;--shadow:0 1.6px 3.6px rgba(0,0,0,.132),0 .3px .9px rgba(0,0,0,.108);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans)}
.topbar{position:sticky;inset-block-start:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:var(--surface);box-shadow:var(--shadow)}
.topbar-main{display:flex;align-items:center;gap:14px}.logo{width:36px;height:36px;object-fit:contain}
.topbar-title{font-weight:700;color:var(--text-bright)}.topbar-sub{font-size:11px;color:var(--text-dim)}
.pill{display:inline-flex;padding:3px 9px;border:1px solid var(--accent-border);border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:600}
.layout{display:flex;min-height:calc(100vh - 65px)}.sidebar{flex:0 0 230px;padding:20px 0;background:var(--surface);border-inline-end:1px solid var(--border)}
.nav-group{padding:14px 22px 6px;color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 22px;border:0;border-inline-start:2px solid transparent;background:transparent;color:var(--text-dim);font:500 13px var(--sans);text-align:start;cursor:pointer}
.nav-btn:hover{background:var(--surface2);color:var(--text)}.nav-btn.active{border-inline-start-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:700}
.content{flex:1;max-width:1080px;padding:32px 40px 72px}.section{display:none}.section.active{display:block}
h2{color:var(--text-bright);font-size:21px;margin-block-end:5px}.section-desc{color:var(--text-dim);font-size:13px;margin-block-end:20px}
h3{color:var(--text-bright);font-size:15px;margin-block:24px 12px}.summary{padding:20px 22px;border:1px solid var(--border);border-radius:12px;background:var(--surface);line-height:1.75}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.field-label{color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}.field-value{margin-block-start:4px;color:var(--text-bright);font-weight:700}.field-desc{margin-block-start:4px;color:var(--text-dim);font-size:12px}
.status{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase}.status-new,.status-create,.status-added{background:var(--accent-bg);color:var(--accent)}.status-preserved,.status-preserve,.status-existing,.status-available,.status-verified{background:var(--pass-bg);color:var(--pass)}.status-changed,.status-update,.status-replace,.status-pending-remediation,.status-unverified{background:var(--warn-bg);color:var(--warn)}.status-skip,.status-source,.status-default{background:var(--purple-bg);color:var(--purple)}
.config-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;word-break:break-word}
.locale-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.locale-card{padding:16px 18px;border:1px solid var(--border);border-block-start:3px solid var(--accent);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.locale-name{font-weight:700;color:var(--text-bright)}.locale-code{margin-block:4px 10px;color:var(--accent);font:700 13px var(--mono);direction:ltr;unicode-bidi:isolate}.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-block-start:8px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}table{width:100%;border-collapse:collapse}th,td{padding:11px 14px;border-block-end:1px solid var(--border);text-align:start;vertical-align:top}th{background:var(--surface2);color:var(--text-dim);font-size:10px;text-transform:uppercase}tr:last-child td{border-block-end:0}
.finding{padding:16px 18px;border:1px solid var(--border);border-inline-start:3px solid var(--warn);border-radius:var(--radius);background:var(--surface);margin-block-end:10px}.finding.review{border-inline-start-color:var(--purple)}.finding-title{display:flex;justify-content:space-between;gap:10px;font-weight:700}.finding-meta{margin-block-start:4px;color:var(--text-dim);font-size:11px}.finding-body{margin-block-start:8px;font-size:13px}.finding-remediation{margin-block-start:8px;padding:8px 10px;background:var(--surface2);border-radius:4px;font-size:12px}
.scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.scope-card{padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}.scope-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.scope-name{font-weight:700;color:var(--text-bright)}.scope-meta{margin-block-start:10px}.scope-chips{display:flex;gap:5px;flex-wrap:wrap;margin-block-start:5px}
.list{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}.list-item{display:flex;gap:10px;padding:12px 16px;border-block-end:1px solid var(--border)}.list-item:last-child{border-block-end:0}.list-mark{color:var(--accent);font-weight:700}.empty{padding:14px 16px;color:var(--text-dim);font-style:italic}
.warning{margin-block-start:12px;padding:12px 14px;border:1px solid #ca501025;border-radius:var(--radius);background:var(--warn-bg);color:var(--text)}
a{color:var(--accent)}footer{position:fixed;inset-block-end:0;inset-inline:0;padding:9px;text-align:center;background:var(--surface);border-block-start:1px solid var(--border);color:var(--text-dim);font-size:11px}
@media(max-width:800px){.layout{display:block}.sidebar{display:flex;flex-wrap:wrap;border-inline-end:0;border-block-end:1px solid var(--border);padding:8px}.nav-group{width:100%}.nav-btn{width:auto;border-inline-start:0;border-block-end:2px solid transparent}.nav-btn.active{border-inline-start:0;border-block-end-color:var(--accent)}.content{padding:20px 16px 72px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-main">
    <img class="logo" src="./power-pages-icon.png" alt="Power Pages"/>
    <div>
      <div class="topbar-title">__PLAN_TITLE__</div>
      <div class="topbar-sub"><bdi dir="auto">__SITE_NAME__</bdi> · <span>__SOURCE_LANGUAGE__</span> <bdi dir="ltr">(__SOURCE_LOCALE__)</bdi></div>
    </div>
  </div>
  <bdi class="pill" dir="ltr">__FRAMEWORK__</bdi>
</header>
<div class="layout">
  <nav class="sidebar">
    <div class="nav-group" data-label="navigation.group"></div>
    <button class="nav-btn active" data-tab="overview"><span>◉</span><span data-label="navigation.overview"></span></button>
    <button class="nav-btn" data-tab="languages"><span>文</span><span data-label="navigation.languages"></span></button>
    <button class="nav-btn" data-tab="changes"><span>▦</span><span data-label="navigation.changes"></span></button>
    <button class="nav-btn" data-tab="readiness"><span>↔</span><span data-label="navigation.readiness"></span></button>
    <button class="nav-btn" data-tab="verification"><span>✓</span><span data-label="navigation.verification"></span></button>
  </nav>
  <main class="content">
    <section class="section active" id="tab-overview">
      <h2 data-label="overview.title"></h2>
      <p class="section-desc" id="overviewDescription"></p>
      <div class="summary" id="summary"></div>
      <div class="grid" id="overviewGrid" style="margin-block-start:14px"></div>
      <div class="grid">
        <div><h3 data-label="overview.frameworkEvidence"></h3><div class="list" id="frameworkEvidence"></div></div>
        <div><h3 data-label="overview.existingDetails"></h3><div class="list" id="existingDetails"></div></div>
      </div>
      <h3 data-label="overview.conflicts"></h3><div class="list" id="conflicts"></div>
      <h3 data-label="overview.configuration"></h3>
      <div class="grid" id="configurationGrid"></div>
      <div id="rootRepair"></div>
    </section>
    <section class="section" id="tab-languages">
      <h2 data-label="languages.title"></h2>
      <p class="section-desc" data-label="languages.description"></p>
      <div class="locale-grid" id="localesGrid"></div>
    </section>
    <section class="section" id="tab-changes">
      <h2 data-label="changes.title"></h2>
      <p class="section-desc" data-label="changes.description"></p>
      <div class="table-wrap"><table><thead><tr>
        <th data-label="changes.path"></th><th data-label="changes.action"></th><th data-label="changes.reason"></th>
      </tr></thead><tbody id="filesBody"></tbody></table></div>
    </section>
    <section class="section" id="tab-readiness">
      <h2 data-label="readiness.title"></h2>
      <p class="section-desc" data-label="readiness.description"></p>
      <div class="card"><div class="field-label" data-label="readiness.transition"></div><div class="field-value" id="directionTransition"></div></div>
      <h3 data-label="readiness.findings"></h3><div id="findings"></div>
      <h3 data-label="readiness.componentScope"></h3><div class="scope-grid" id="componentScope"></div>
      <div class="grid">
        <div><h3 data-label="readiness.physicalExceptions"></h3><div class="list" id="physicalExceptions"></div></div>
        <div><h3 data-label="readiness.scriptFonts"></h3><div class="list" id="scriptFonts"></div></div>
      </div>
      <h3 data-label="readiness.unavailableLocales"></h3><div class="list" id="unavailableLocales"></div>
    </section>
    <section class="section" id="tab-verification">
      <h2 data-label="verification.title"></h2>
      <p class="section-desc" data-label="verification.description"></p>
      <h3 data-label="verification.checks"></h3><div class="list" id="validationChecks"></div>
      <h3 data-label="verification.limitations"></h3><div class="list" id="limitations"></div>
    </section>
  </main>
</div>
<footer data-label="footer.aiWarning"></footer>
<script id="siteNameData" type="application/json">__SITE_NAME_DATA__</script>
<script id="summaryData" type="application/json">__SUMMARY_DATA__</script>
<script id="metaData" type="application/json">__META_DATA__</script>
<script id="labelsData" type="application/json">__PLAN_LABELS__</script>
<script id="discoveryData" type="application/json">__DISCOVERY_DATA__</script>
<script id="configData" type="application/json">__CONFIGURATION_DATA__</script>
<script id="localesData" type="application/json">__LOCALES_DATA__</script>
<script id="filesData" type="application/json">__FILES_DATA__</script>
<script id="readinessData" type="application/json">__READINESS_DATA__</script>
<script id="validationData" type="application/json">__VALIDATION_DATA__</script>
<script id="limitationsData" type="application/json">__LIMITATIONS_DATA__</script>
<script>
function readData(id){return JSON.parse(document.getElementById(id).textContent)}
function esc(value){const node=document.createElement('div');node.textContent=value==null?'':String(value);return node.innerHTML}
const LABELS=readData('labelsData'),CONFIG=readData('configData'),LOCALES=readData('localesData');
const FILES=readData('filesData'),READINESS=readData('readinessData'),VALIDATION=readData('validationData'),LIMITATIONS=readData('limitationsData');
const META=readData('metaData'),DISCOVERY=readData('discoveryData');
function label(path){return path.split('.').reduce((value,key)=>value&&value[key],LABELS)||path}
function status(value){return label('status.'+String(value).replace(/-([a-z])/g,(_,c)=>c.toUpperCase()))}
function list(containerId,items,emptyLabel,technical){
  const node=document.getElementById(containerId);
  node.innerHTML=items.length?items.map(item=>'<div class="list-item"><span class="list-mark">✓</span><div'+(technical?' class="mono"':'')+'>'+esc(item)+'</div></div>').join(''):'<div class="empty">'+esc(label(emptyLabel))+'</div>';
}
document.querySelectorAll('[data-label]').forEach(node=>{node.textContent=label(node.dataset.label)});
document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(item=>item.classList.remove('active'));
  document.querySelectorAll('.section').forEach(item=>item.classList.remove('active'));
  button.classList.add('active');document.getElementById('tab-'+button.dataset.tab).classList.add('active');
}));
const overview=document.getElementById('overviewDescription'),parts=label('overview.description').split('{siteName}');
overview.append(document.createTextNode(parts[0]));const siteName=document.createElement('bdi');siteName.dir='auto';siteName.textContent=readData('siteNameData').text;overview.append(siteName);overview.append(document.createTextNode(parts.slice(1).join('{siteName}')));
document.getElementById('summary').textContent=readData('summaryData').text;
const overviewItems=[
  [label('overview.framework'),META.framework,true],
  [label('overview.invocation'),label('invocation.'+(META.invocationContext==='create-site'?'createSite':'direct'))],
  [label('overview.operation'),label('operation.'+({'add-languages':'addLanguages'}[META.operation]||META.operation))],
  [label('overview.existingSetup'),label('status.'+(META.existingLocalizationDetected?'yes':'no'))]
];
document.getElementById('overviewGrid').innerHTML=overviewItems.map(item=>'<div class="card"><div class="field-label">'+esc(item[0])+'</div><div class="field-value'+(item[2]?' mono':'')+'">'+esc(item[1])+'</div></div>').join('');
list('frameworkEvidence',DISCOVERY.frameworkEvidence,'readiness.none');
list('existingDetails',DISCOVERY.existingSetup,'readiness.none');
list('conflicts',DISCOVERY.conflicts,'overview.noConflicts');
function configCard(labelPath,item,extra,technical,showStatus){
  return '<div class="card"><div class="config-head"><div><div class="field-label">'+esc(label(labelPath))+'</div><div class="field-value'+(technical?' mono':'')+'">'+esc(item.value)+'</div></div>'+(showStatus?'<span class="status status-'+item.status+'">'+esc(status(item.status))+'</span>':'')+'</div>'+(item.description?'<div class="field-desc">'+esc(item.description)+'</div>':'')+(extra||'')+'</div>';
}
let packageExtra='<div class="field-desc"><strong>'+esc(label('configuration.verification'))+':</strong> '+esc(status(CONFIG.package.verification))+'</div>';
packageExtra+='<div class="field-desc"><strong>'+esc(label('configuration.selection'))+':</strong> '+esc(label('packageSelection.'+CONFIG.package.selection))+'</div>';
packageExtra+='<div class="field-desc"><strong>'+esc(label('configuration.evidenceSource'))+':</strong> '+esc(label('evidenceSource.'+CONFIG.package.evidenceSource.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())))+'</div>';
if(CONFIG.package.evidenceUrl)packageExtra+='<div class="field-desc"><strong>'+esc(label('configuration.evidence'))+':</strong> <span class="mono">'+esc(CONFIG.package.evidenceUrl)+'</span></div>';
if(CONFIG.package.initializationEvidence)packageExtra+='<div class="field-desc"><strong>'+esc(label('configuration.initialization'))+':</strong> <span class="mono">'+esc(CONFIG.package.initializationEvidence.file)+' · '+esc(CONFIG.package.initializationEvidence.marker)+'</span></div>';
document.getElementById('configurationGrid').innerHTML=
  configCard('configuration.package',CONFIG.package,packageExtra,true,true)+configCard('configuration.mode',CONFIG.mode,'',true,true)+configCard('configuration.defaultLocale',CONFIG.defaultLocale,'',true,true)+configCard('configuration.translation',CONFIG.translation,'',false,false)+configCard('configuration.selector',CONFIG.selector,'',false,false);
if(CONFIG.translation.warning)document.getElementById('configurationGrid').insertAdjacentHTML('afterend','<div class="warning">'+esc(CONFIG.translation.warning)+'</div>');
if(CONFIG.rootDocumentRepair){const repair=CONFIG.rootDocumentRepair;document.getElementById('rootRepair').innerHTML='<h3>'+esc(label('configuration.rootRepair'))+'</h3><div class="card mono">'+esc(repair.file)+' · lang="'+esc(repair.lang)+'" dir="'+esc(repair.dir)+'"</div>'}
document.getElementById('localesGrid').innerHTML=LOCALES.map(locale=>'<div class="locale-card"><div class="locale-name">'+esc(locale.language)+'</div><div class="locale-code">'+esc(locale.locale)+'</div><div class="field-desc">'+esc(label('languages.direction'))+': <bdi dir="ltr">'+esc(locale.direction)+'</bdi></div><div class="chip-row">'+locale.roles.map(role=>'<span class="status status-'+esc(role)+'">'+esc(status(role))+'</span>').join('')+'<span class="status status-'+esc(locale.availability)+'">'+esc(status(locale.availability))+'</span></div></div>').join('');
document.getElementById('filesBody').innerHTML=FILES.map(file=>'<tr><td class="mono">'+esc(file.path)+'</td><td><span class="status status-'+esc(file.action)+'">'+esc(status(file.action))+'</span></td><td>'+esc(file.reason)+'</td></tr>').join('');
document.getElementById('directionTransition').textContent=READINESS.transition;
document.getElementById('findings').innerHTML=READINESS.findings.length?READINESS.findings.map(finding=>'<article class="finding '+(finding.severity==='review'?'review':'')+'"><div class="finding-title"><span>'+esc(finding.message)+'</span><span class="status status-'+esc(finding.severity==='review'?'pending-remediation':'changed')+'">'+esc(label('severity.'+finding.severity))+'</span></div><div class="finding-meta"><span class="mono">'+esc(finding.file)+(finding.line?' · '+esc(finding.line):'')+'</span> · '+esc(label('readiness.rule'))+': <span class="mono">'+esc(finding.rule)+'</span> · '+esc(label('readiness.scope'))+': <span class="mono">'+esc(finding.scope)+'</span> · '+esc(label('readiness.affectedLocales'))+': <span class="mono">'+esc((finding.affectedLocales||[]).join(', '))+'</span></div>'+(finding.remediation?'<div class="finding-remediation"><strong>'+esc(label('readiness.remediation'))+':</strong> '+esc(finding.remediation)+'</div>':'')+'</article>').join(''):'<div class="empty">'+esc(label('readiness.noFindings'))+'</div>';
const classificationLabels={'direction-neutral':'directionNeutral','direction-aware':'directionAware','direction-fixed':'directionFixed','unknown-third-party':'unknownThirdParty'};
document.getElementById('componentScope').innerHTML=READINESS.componentScope.map(item=>'<article class="scope-card"><div class="scope-head"><div class="scope-name">'+esc(item.component)+'</div><span class="status status-existing">'+esc(label('classification.'+classificationLabels[item.classification]))+'</span></div><div class="field-desc"><strong>'+esc(label('readiness.reason'))+':</strong> '+esc(item.reason)+'</div><div class="scope-meta"><div class="field-label">'+esc(label('readiness.states'))+'</div><div class="scope-chips">'+item.states.map(value=>'<span class="status status-source">'+esc(value)+'</span>').join('')+'</div></div><div class="scope-meta"><div class="field-label">'+esc(label('readiness.viewports'))+'</div><div class="scope-chips">'+item.viewports.map(value=>'<span class="status status-default">'+esc(label('viewport.'+value))+'</span>').join('')+'</div></div><div class="scope-meta"><div class="field-label">'+esc(label('readiness.checks'))+'</div><div class="list">'+item.checks.map(value=>'<div class="list-item"><span class="list-mark">✓</span><div>'+esc(value)+'</div></div>').join('')+'</div></div></article>').join('');
list('physicalExceptions',READINESS.physicalExceptions,'readiness.none');
list('scriptFonts',READINESS.scriptFonts,'readiness.none');
list('unavailableLocales',READINESS.unavailableLocales,'readiness.none',true);
list('validationChecks',VALIDATION.map(item=>item.description),'readiness.none');
list('limitations',LIMITATIONS,'verification.noLimitations');
</script>
</body>
</html>
