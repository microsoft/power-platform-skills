<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a Power Pages template</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #5f6f89;
      --brand: #742774;
      --line: #dce3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f9fbff 0%, #eef2f8 100%);
      color: var(--ink);
    }
    main {
      width: min(1120px, calc(100% - 48px));
      margin: 48px auto;
    }
    header {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-bottom: 28px;
    }
    header img {
      width: 52px;
      height: 52px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      letter-spacing: -0.04em;
    }
    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }
    article {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 20px 55px rgba(42, 58, 88, 0.12);
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0;
      border-bottom: 1px solid var(--line);
      background: #e6ebf3;
    }
    .preview {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #e6ebf3;
    }
    .content {
      padding: 22px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.55;
      color: var(--muted);
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: #f2e7f6;
      color: var(--brand);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .keywords {
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="./power-pages-icon.png" alt="" />
      <div>
        <h1>Choose a Power Pages template</h1>
        <p class="hint">Review the templates here, then return to the terminal to make your selection.</p>
      </div>
    </header>
    <section class="grid" id="templates"></section>
  </main>
  <script>
    const templates = __TEMPLATES_JSON__;
    const root = document.getElementById('templates');
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[ch]));

    root.innerHTML = templates.map((template) => {
      const images = Array.isArray(template.previewImages) ? template.previewImages : [];
      const keywords = Array.isArray(template.keywords) ? template.keywords.join(', ') : '';
      // `audience` is an array of personas (makers/developers/…) per the samples
      // repo schema; render one pill each rather than a comma-joined blob.
      const audiences = Array.isArray(template.audience) ? template.audience : [];
      const previewMarkup = images.length
        ? `<div class="preview-grid">${images.map((image, index) => `<img class="preview" src="${esc(image)}" alt="Preview ${index + 1} of ${esc(template.displayName)}" />`).join('')}</div>`
        : '<div class="preview" aria-label="No preview image"></div>';
      return `
        <article>
          ${previewMarkup}
          <div class="content">
            <div class="meta">
              <span class="pill">${esc(template.framework)}</span>
              ${audiences.map((audience) => `<span class="pill">${esc(audience)}</span>`).join('')}
            </div>
            <h2>${esc(template.displayName)}</h2>
            <p>${esc(template.description)}</p>
            ${keywords ? `<div class="keywords">Keywords: ${esc(keywords)}</div>` : ''}
          </div>
        </article>`;
    }).join('');
  </script>
</body>
</html>
