<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Importing __TEMPLATE_NAME__ template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:," />
  <style>
    :root {
      --pp-violet: #7B5EA7;
      --pp-purple: #8B6FC0;
      --pp-lavender: #A78BDB;
      --pp-periwinkle: #8088D9;
      --pp-sky: #5A9BD5;
      --pp-deep-violet: #5C3D8F;
      --pp-bg: #F7F5FA;
      --pp-surface: #FFFFFF;
      --pp-text: #2D1B4E;
      --pp-text-secondary: #6B5A82;
      --pp-text-muted: #9B8FB5;
      --pp-border: rgba(139, 111, 192, 0.12);
      --pp-error: #B42318;
      --pp-success: #087443;
      --pp-glow: rgba(139, 111, 192, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; background: var(--pp-bg); color: var(--pp-text); font-family: 'DM Sans', sans-serif; }
    .loading-wrapper { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--pp-bg); }
    .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .ambient::before {
      content: ''; position: absolute; width: 160%; height: 160%; top: -30%; left: -30%;
      background:
        radial-gradient(ellipse 600px 600px at 25% 30%, rgba(167, 139, 219, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 75% 70%, rgba(90, 155, 213, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 800px 400px at 50% 50%, rgba(139, 111, 192, 0.06) 0%, transparent 60%);
      animation: ambientDrift 25s ease-in-out infinite alternate;
    }
    @keyframes ambientDrift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-3%, 2%) scale(1.04); }
      100% { transform: translate(2%, -1%) scale(0.98); }
    }
    .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .particle { position: absolute; border-radius: 50%; opacity: 0; animation: particleFloat linear infinite; }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
    .grid-overlay {
      position: fixed; inset: 0; z-index: 1;
      background-image: linear-gradient(rgba(139, 111, 192, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(139, 111, 192, 0.04) 1px, transparent 1px);
      background-size: 60px 60px; animation: gridPulse 8s ease-in-out infinite alternate;
    }
    @keyframes gridPulse { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }
    .center-stage { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 40px 28px; min-height: 100vh; max-height: 100vh; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
    .center-stage::-webkit-scrollbar { display: none; }
    .orbit-system { position: relative; width: 124px; height: 124px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .core-shape { position: absolute; width: 68px; height: 68px; z-index: 5; background: url('./power-pages-icon.png') center/contain no-repeat; animation: coreFloat 4s ease-in-out infinite; }
    @keyframes coreFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.025); } }
    .core-glow { position: absolute; width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle, rgba(167, 139, 219, 0.18) 0%, transparent 70%); z-index: 3; animation: coreGlow 3s ease-in-out infinite alternate; filter: blur(18px); }
    @keyframes coreGlow { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0.9; } }
    .orbit-ring { position: absolute; border: 1px solid rgba(139, 111, 192, 0.15); border-radius: 50%; animation: ringRotate linear infinite; }
    .orbit-ring:nth-child(3) { width: 90px; height: 90px; animation-duration: 12s; }
    .orbit-ring:nth-child(4) { width: 114px; height: 114px; animation-duration: 18s; animation-direction: reverse; border-color: rgba(90, 155, 213, 0.12); }
    .orbit-ring:nth-child(5) { width: 138px; height: 138px; animation-duration: 25s; border-style: dashed; border-color: rgba(139, 111, 192, 0.08); }
    @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .orbit-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; z-index: 6; }
    .orbit-dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; filter: blur(6px); }
    .orbit-dot:nth-child(6) { background: var(--pp-lavender); box-shadow: 0 0 10px rgba(167, 139, 219, 0.5); animation: orbitA 12s linear infinite; }
    .orbit-dot:nth-child(6)::after { background: rgba(167, 139, 219, 0.4); }
    .orbit-dot:nth-child(7) { background: var(--pp-sky); box-shadow: 0 0 10px rgba(90, 155, 213, 0.5); width: 6px; height: 6px; animation: orbitB 18s linear infinite reverse; }
    .orbit-dot:nth-child(7)::after { background: rgba(90, 155, 213, 0.4); }
    .orbit-dot:nth-child(8) { background: var(--pp-periwinkle); box-shadow: 0 0 8px rgba(128, 136, 217, 0.5); width: 5px; height: 5px; animation: orbitC 25s linear infinite; }
    .orbit-dot:nth-child(8)::after { background: rgba(128, 136, 217, 0.4); }
    @keyframes orbitA { from { transform: rotate(0deg) translateX(45px) rotate(0deg); } to { transform: rotate(360deg) translateX(45px) rotate(-360deg); } }
    @keyframes orbitB { from { transform: rotate(0deg) translateX(57px) rotate(0deg); } to { transform: rotate(360deg) translateX(57px) rotate(-360deg); } }
    @keyframes orbitC { from { transform: rotate(0deg) translateX(69px) rotate(0deg); } to { transform: rotate(360deg) translateX(69px) rotate(-360deg); } }
    .text-content { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .brand-title { font-family: 'Outfit', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--pp-violet); opacity: 0; animation: fadeSlideUp 1s ease-out 0.5s forwards; }
    .main-heading { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.25; background: linear-gradient(135deg, var(--pp-deep-violet) 0%, var(--pp-violet) 40%, var(--pp-sky) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; opacity: 0; animation: fadeSlideUp 1s ease-out 0.8s forwards; }
    .status-area { height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; opacity: 0; animation: fadeSlideUp 1s ease-out 1.2s forwards; }
    .status-message { position: absolute; white-space: nowrap; font-size: 13px; font-weight: 400; color: var(--pp-text-secondary); display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(20px); transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
    .status-message.active { opacity: 1; transform: translateY(0); }
    .status-message.exiting { opacity: 0; transform: translateY(-20px); }
    .status-icon { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .status-icon.working { border: 2px solid rgba(139, 111, 192, 0.2); border-top-color: var(--pp-violet); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .preview-showcase { position: relative; width: min(900px, calc(100vw - 72px)); height: min(46vh, 500px); max-height: calc(100vh - 390px); min-height: 240px; opacity: 0; animation: fadeSlideUp 1s ease-out 1.35s forwards; flex: 0 0 auto; }
    .preview-frame { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; }
    .preview-track { display: flex; width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform; }
    .preview-slide { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
    .preview-card { display: inline-flex; max-width: 100%; max-height: 100%; border: 1px solid rgba(139, 111, 192, 0.12); border-radius: 20px; background: var(--pp-surface); box-shadow: 0 2px 12px rgba(139, 111, 192, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04); overflow: hidden; }
    .preview-card img { display: block; max-width: 100%; max-height: min(46vh, 500px); width: auto; height: auto; object-fit: contain; background: var(--pp-surface); }
    .preview-empty { padding: 20px; color: var(--pp-text-muted); font-size: 13px; text-align: center; }
    .preview-nav { position: absolute; top: 50%; z-index: 7; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(139, 111, 192, 0.16); background: rgba(255, 255, 255, 0.88); color: var(--pp-violet); box-shadow: 0 2px 12px rgba(139, 111, 192, 0.10), 0 1px 3px rgba(0, 0, 0, 0.04); cursor: pointer; font-size: 24px; line-height: 30px; display: flex; align-items: center; justify-content: center; transform: translateY(-50%); transition: background 0.2s ease, transform 0.2s ease; }
    .preview-nav:hover { background: var(--pp-surface); transform: translateY(-50%) scale(1.04); }
    .preview-nav:focus-visible { outline: 2px solid var(--pp-sky); outline-offset: 3px; }
    .preview-nav-prev { left: 8px; }
    .preview-nav-next { right: 8px; }
    .preview-showcase.single .preview-nav { display: none; }
    .progress-container { width: min(520px, calc(100vw - 72px)); opacity: 0; animation: fadeSlideUp 1s ease-out 1.5s forwards; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .progress-track { display: none; width: 100%; height: 3px; background: rgba(139, 111, 192, 0.1); border-radius: 4px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--pp-violet), var(--pp-lavender), var(--pp-sky), transparent); position: absolute; top: 0; left: -40%; animation: infiniteSlide 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .progress-fill::after { content: ''; position: absolute; right: 10%; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--pp-sky); box-shadow: 0 0 8px rgba(90, 155, 213, 0.5), 0 0 16px rgba(90, 155, 213, 0.2); opacity: 0.9; }
    @keyframes infiniteSlide { 0% { left: -40%; } 100% { left: 100%; } }
    .progress-track.complete .progress-fill { width: 100%; left: 0; animation: none; background: linear-gradient(90deg, var(--pp-violet), var(--pp-lavender), var(--pp-sky)); transition: all 0.8s ease; }
    .progress-track.complete .progress-fill::after { display: none; }
    .progress-label-text { font-size: 11px; color: var(--pp-text-muted); font-family: 'DM Sans', sans-serif; letter-spacing: 0.3px; }
    .phase-steps { width: min(640px, calc(100vw - 72px)); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; opacity: 0; animation: fadeSlideUp 1s ease-out 1.65s forwards; }
    .phase-step { position: relative; overflow: hidden; border: 1px solid rgba(139, 111, 192, 0.10); border-radius: 12px; background: rgba(255, 255, 255, 0.72); color: var(--pp-text-muted); font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 500; padding: 8px 10px; text-align: center; }
    .phase-step.active { border-color: rgba(139, 111, 192, 0.28); color: var(--pp-violet); background: linear-gradient(90deg, rgba(255,255,255,0.88), rgba(139,111,192,0.12), rgba(90,155,213,0.14), rgba(255,255,255,0.88)); background-size: 220% 100%; animation: pillProgress 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .phase-step.done { color: #229E5C; border-color: rgba(34, 158, 92, 0.20); background: rgba(34, 158, 92, 0.06); }
    .feature-cards { display: flex; gap: 10px; margin-top: 4px; opacity: 0; animation: fadeSlideUp 1s ease-out 2s forwards; }
    .feature-card { background: var(--pp-surface); border: 1px solid rgba(139, 111, 192, 0.1); border-radius: 14px; padding: 14px 16px; width: 128px; box-shadow: 0 2px 12px rgba(139, 111, 192, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04); opacity: 0; transform: translateY(20px) scale(0.95); transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
    .feature-card.visible { opacity: 1; transform: translateY(0) scale(1); }
    .feature-card:hover { border-color: rgba(139, 111, 192, 0.2); box-shadow: 0 4px 24px rgba(139, 111, 192, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04); transform: translateY(-2px) scale(1.02); }
    .feature-card-icon { font-size: 18px; margin-bottom: 7px; display: block; }
    .feature-card-label { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 500; color: var(--pp-text-secondary); line-height: 1.35; }
    .connector-lines { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .connector { position: absolute; height: 1px; background: linear-gradient(90deg, transparent, rgba(139, 111, 192, 0.12), transparent); animation: connectorSweep 6s ease-in-out infinite; }
    @keyframes connectorSweep { 0%, 100% { transform: translateX(-100%); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(100vw); opacity: 0; } }
    .scanline { position: fixed; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, var(--pp-lavender) 50%, transparent 100%); opacity: 0.06; z-index: 2; animation: scanDrop 8s linear infinite; pointer-events: none; }
    @keyframes scanDrop { 0% { top: -2px; } 100% { top: 100%; } }
    .tip-area { text-align: center; margin-top: 2px; opacity: 0; animation: fadeSlideUp 1s ease-out 3s forwards; }
    .tip-label { font-size: 9px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--pp-text-muted); margin-bottom: 6px; font-family: 'Outfit', sans-serif; }
    .tip-text { font-size: 11px; color: var(--pp-text-muted); max-width: 360px; line-height: 1.45; margin: 0 auto; min-height: 32px; transition: opacity 0.6s ease, transform 0.6s ease; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 100; max-width: 420px; background: var(--pp-surface); border: 1px solid var(--pp-border); border-radius: 16px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(40, 24, 70, 0.14); text-align: left; color: var(--pp-text); animation: toastEnter 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
    .toast[hidden] { display: none; }
    .toast.error .toast-title { color: var(--pp-error); }
    .toast.success .toast-title { color: var(--pp-success); }
    .toast-title { font-weight: 700; margin-bottom: 4px; }
    .toast-message { font-size: 13px; color: var(--pp-text-secondary); }
    @keyframes toastEnter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pillProgress { 0% { background-position: 140% 0; } 100% { background-position: -80% 0; } }
    @media (prefers-reduced-motion: reduce) { .preview-track { transition: none; } .phase-step.active { animation: none; } }
    @media (max-height: 760px) { .feature-cards, .tip-area { display: none; } .preview-showcase { max-height: calc(100vh - 300px); } }
    @media (max-width: 600px) { .main-heading { font-size: 24px; } .progress-container { width: 260px; } .phase-steps { grid-template-columns: 1fr; width: min(320px, calc(100vw - 48px)); } .feature-cards { flex-direction: column; align-items: center; } .orbit-system { width: 124px; height: 124px; } }
  </style>
</head>
<body>
  <div class="loading-wrapper">
    <div class="ambient"></div>
    <div class="grid-overlay"></div>
    <div class="scanline"></div>
    <div class="particles" id="particles"></div>
    <div class="connector-lines" id="connectors"></div>

    <div class="center-stage" id="centerStage">
      <div class="orbit-system">
        <div class="core-glow"></div>
        <div class="core-shape" id="coreShape"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-ring"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
      </div>

      <div class="text-content">
        <div class="brand-title">Power Pages</div>
        <div class="main-heading" id="mainHeading">Importing __TEMPLATE_NAME__ template</div>

        <div class="status-area" id="statusArea"></div>

        <div class="preview-showcase" id="previewShowcase" aria-label="Template preview slideshow">
          <button class="preview-nav preview-nav-prev" id="previewPrev" type="button" aria-label="Previous template preview">&#8249;</button>
          <div class="preview-frame" id="previewFrame"></div>
          <button class="preview-nav preview-nav-next" id="previewNext" type="button" aria-label="Next template preview">&#8250;</button>
        </div>

        <div class="progress-container">
          <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-label-text" id="progressLabel">Starting template import...</span>
        </div>
        <div class="phase-steps" aria-label="Template setup phases">
          <div class="phase-step active" id="phaseSolution">Importing solution</div>
          <div class="phase-step" id="phaseSeed">Seeding data</div>
          <div class="phase-step" id="phaseActivation">Activating site</div>
        </div>
      </div>

      <div class="feature-cards">
        <div class="feature-card" data-delay="0">
          <span class="feature-card-icon">&#128274;</span>
          <span class="feature-card-label">Enterprise-grade security</span>
        </div>
        <div class="feature-card" data-delay="400">
          <span class="feature-card-icon">&#9889;</span>
          <span class="feature-card-label">Lightning-fast performance</span>
        </div>
        <div class="feature-card" data-delay="800">
          <span class="feature-card-icon">&#127760;</span>
          <span class="feature-card-label">Ready to scale globally</span>
        </div>
      </div>

      <div class="tip-area">
        <div class="tip-label">Did you know</div>
        <div class="tip-text" id="tipText"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden>
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-message" id="toastMessage"></div>
  </div>

  <script>
    const PREVIEWS = __JSON_PREVIEW_IMAGES__;
    const STATUS_URL = __JSON_STATUS_URL__;
    const TEMPLATE_NAME = __JSON_TEMPLATE_NAME__;

    (function () {
      var particlesEl = document.getElementById('particles');
      var connectorsEl = document.getElementById('connectors');
      var statusArea = document.getElementById('statusArea');
      var mainHeading = document.getElementById('mainHeading');
      var progressLabel = document.getElementById('progressLabel');
      var progressTrack = document.getElementById('progressTrack');
      var progressFill = document.getElementById('progressFill');
      var tipTextEl = document.getElementById('tipText');
      var previewShowcase = document.getElementById('previewShowcase');
      var previewFrame = document.getElementById('previewFrame');
      var previewPrev = document.getElementById('previewPrev');
      var previewNext = document.getElementById('previewNext');
      var toast = document.getElementById('toast');
      var toastTitle = document.getElementById('toastTitle');
      var toastMessage = document.getElementById('toastMessage');
      var phaseSolution = document.getElementById('phaseSolution');
      var phaseSeed = document.getElementById('phaseSeed');
      var phaseActivation = document.getElementById('phaseActivation');
      var currentStatusIndex = 0;
      var previewIndex = 0;
      var previewPaused = false;
      var toastShown = false;
      var redirectScheduled = false;
      var latestLiveMessage = '';

      function createParticle() {
        if (!particlesEl) return;
        var p = document.createElement('div');
        p.classList.add('particle');
        var size = Math.random() * 3 + 1;
        var colors = ['rgba(167,139,219,0.5)', 'rgba(128,136,217,0.5)', 'rgba(90,155,213,0.5)', 'rgba(139,111,192,0.5)'];
        var color = colors[Math.floor(Math.random() * colors.length)];
        p.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (Math.random() * 100) + '%;background:' + color + ';box-shadow:0 0 ' + (size * 2) + 'px ' + color + ';animation-duration:' + (Math.random() * 15 + 12) + 's;animation-delay:' + (Math.random() * 10) + 's;';
        particlesEl.appendChild(p);
        setTimeout(function () { p.remove(); }, 30000);
      }

      function createConnector() {
        if (!connectorsEl) return;
        var c = document.createElement('div');
        c.classList.add('connector');
        c.style.cssText = 'top:' + (Math.random() * 100) + '%;width:' + (Math.random() * 300 + 200) + 'px;animation-duration:' + (Math.random() * 4 + 4) + 's;animation-delay:' + (Math.random() * 6) + 's;';
        connectorsEl.appendChild(c);
        setTimeout(function () { c.remove(); }, 12000);
      }

      function renderStatusMessage(text) {
        if (!statusArea) return;
        var existing = statusArea.querySelector('.status-message');
        if (existing) {
          existing.classList.remove('active');
          existing.classList.add('exiting');
          setTimeout(function () { existing.remove(); }, 700);
        }
        var msg = document.createElement('div');
        msg.classList.add('status-message');
        var icon = document.createElement('div');
        icon.classList.add('status-icon', 'working');
        msg.appendChild(icon);
        var textEl = document.createElement('span');
        textEl.textContent = text;
        msg.appendChild(textEl);
        statusArea.appendChild(msg);
        requestAnimationFrame(function () { requestAnimationFrame(function () { msg.classList.add('active'); }); });
      }

      function updatePhaseLabel(text) {
        if (progressLabel) progressLabel.textContent = text;
      }

      function phaseForStatus(status) {
        if (status && (status.phase === 'seed' || status.phase === 'seeding')) return 'seed';
        if (status && (status.phase === 'activation' || status.phase === 'activating')) return 'activation';
        if (status && status.state === 'succeeded' && status.redirectUrl) return 'done';
        if (status && status.state === 'succeeded') return 'solutionDone';
        return 'solution';
      }

      function renderPhase(phase) {
        if (!phaseSolution || !phaseSeed || !phaseActivation) return;
        phaseSolution.className = 'phase-step';
        phaseSeed.className = 'phase-step';
        phaseActivation.className = 'phase-step';
        phaseSolution.textContent = 'Importing solution';
        phaseSeed.textContent = 'Seeding data';
        phaseActivation.textContent = 'Activating site';
        if (phase === 'seed') {
          phaseSolution.classList.add('done');
          phaseSolution.textContent = 'Imported solution';
          phaseSeed.classList.add('active');
          if (mainHeading) mainHeading.textContent = 'Seeding ' + TEMPLATE_NAME + ' template data';
          return;
        }
        if (phase === 'solutionDone') {
          phaseSolution.classList.add('done');
          phaseSolution.textContent = 'Imported solution';
          if (mainHeading) mainHeading.textContent = 'Imported ' + TEMPLATE_NAME + ' template';
          return;
        }
        if (phase === 'activation') {
          phaseSolution.classList.add('done');
          phaseSolution.textContent = 'Imported solution';
          phaseSeed.classList.add('done');
          phaseSeed.textContent = 'Seeded data';
          phaseActivation.classList.add('active');
          if (mainHeading) mainHeading.textContent = 'Activating ' + TEMPLATE_NAME + ' template site';
          return;
        }
        if (phase === 'done') {
          phaseSolution.classList.add('done');
          phaseSolution.textContent = 'Imported solution';
          phaseSeed.classList.add('done');
          phaseSeed.textContent = 'Seeded data';
          phaseActivation.classList.add('done');
          phaseActivation.textContent = 'Activated site';
          if (mainHeading) mainHeading.textContent = TEMPLATE_NAME + ' template is ready';
          return;
        }
        phaseSolution.classList.add('active');
        if (mainHeading) mainHeading.textContent = 'Importing ' + TEMPLATE_NAME + ' template';
      }

      function showStatus(index) {
        var status = statuses[index];
        renderStatusMessage(latestLiveMessage || status.text);
        if (latestLiveMessage) {
          updatePhaseLabel(latestLiveMessage);
          return;
        }
        var phaseIndex = Math.min(Math.floor((index / statuses.length) * phaseLabels.length), phaseLabels.length - 1);
        updatePhaseLabel(phaseLabels[phaseIndex]);
      }

      function advanceStatus() {
        showStatus(currentStatusIndex % statuses.length);
        var duration = statuses[currentStatusIndex % statuses.length].duration;
        setTimeout(function () {
          currentStatusIndex++;
          advanceStatus();
        }, duration);
      }

      function buildPreviewCarousel() {
        if (!previewFrame) return;
        if (!PREVIEWS.length) {
          previewShowcase.classList.add('single');
          previewFrame.innerHTML = '<div class="preview-empty">No preview images are available for this template.</div>';
          return;
        }
        previewShowcase.classList.toggle('single', PREVIEWS.length < 2);
        var track = document.createElement('div');
        track.className = 'preview-track';
        PREVIEWS.forEach(function (src, index) {
          var slide = document.createElement('div');
          slide.className = 'preview-slide';
          var card = document.createElement('div');
          card.className = 'preview-card';
          var img = document.createElement('img');
          img.src = src;
          img.alt = 'Template preview ' + (index + 1);
          card.appendChild(img);
          slide.appendChild(card);
          track.appendChild(slide);
        });
        previewFrame.replaceChildren(track);
      }

      function setPreview(index) {
        var track = previewFrame && previewFrame.querySelector('.preview-track');
        if (!track) return;
        previewIndex = (index + PREVIEWS.length) % PREVIEWS.length;
        track.style.transform = 'translateX(-' + (previewIndex * 100) + '%)';
      }

      function showNextPreview() {
        setPreview(previewIndex + 1);
      }

      function showPreviousPreview() {
        setPreview(previewIndex - 1);
      }

      function showToast(kind, title, message) {
        if (toastShown) return;
        toastShown = true;
        toast.className = 'toast ' + kind;
        toastTitle.textContent = title;
        toastMessage.textContent = message;
        toast.hidden = false;
      }

      function scheduleRedirect(url) {
        if (redirectScheduled || !/^https?:\/\//i.test(String(url || ''))) return;
        redirectScheduled = true;
        setTimeout(function () { window.location.assign(url); }, 1500);
      }

      async function pollStatus() {
        try {
          var res = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return;
          var status = await res.json();
          renderPhase(phaseForStatus(status));
          if (status.message) {
            latestLiveMessage = status.message;
            renderStatusMessage(status.message);
            updatePhaseLabel(status.message);
          }
          if (status.state === 'failed' || status.state === 'canceled' || status.state === 'timeout') {
            showToast('error', 'Template import needs attention', 'Check the agent terminal for details.');
          }
          if (status.state === 'succeeded' && status.redirectUrl) {
            progressTrack.classList.add('complete');
            showToast('success', 'Template site is ready', 'Opening the live site in this tab.');
          }
          if (status.redirectUrl) {
            scheduleRedirect(status.redirectUrl);
          }
        } catch {}
      }

      var statuses = [
        { text: 'Starting template import', duration: 8000 },
        { text: 'Uploading solution package', duration: 10000 },
        { text: 'Importing Dataverse components', duration: 12000 },
        { text: 'Applying template metadata', duration: 10000 },
        { text: 'Waiting for Dataverse', duration: 12000 },
        { text: 'Preparing activation handoff', duration: 10000 }
      ];

      var phaseLabels = [
        'Starting template import...', 'Uploading solution...', 'Importing components...',
        'Applying metadata...', 'Checking import status...', 'Almost there...'
      ];

      var tips = [
        'Power Pages sites are built on Microsoft Dataverse, giving you enterprise-level data capabilities from day one.',
        'Your site automatically includes responsive design - it looks great on phones, tablets, and desktops.',
        'With role-based security, you can control exactly who sees what on your site.',
        'Power Pages integrates seamlessly with Power Automate, Power BI, and the entire Microsoft ecosystem.',
        'You can extend your site with custom code, and JavaScript for unlimited flexibility.',
        'Built-in content delivery networks ensure your pages load fast for users worldwide.',
        'Multi-language support lets you reach audiences across the globe with localized content.'
      ];

      var tipIndex = 0;
      function showTip() {
        if (!tipTextEl) return;
        tipTextEl.style.opacity = '0';
        tipTextEl.style.transform = 'translateY(8px)';
        setTimeout(function () {
          tipTextEl.textContent = tips[tipIndex % tips.length];
          tipTextEl.style.opacity = '1';
          tipTextEl.style.transform = 'translateY(0)';
          tipIndex++;
        }, 500);
      }

      for (var i = 0; i < 30; i++) { (function (n) { setTimeout(createParticle, n * 200); })(i); }
      setInterval(createParticle, 800);
      for (var j = 0; j < 8; j++) { (function (n) { setTimeout(createConnector, n * 1500); })(j); }
      setInterval(createConnector, 2000);

      setTimeout(advanceStatus, 2000);
      setTimeout(function () {
        var cards = document.querySelectorAll('.feature-card');
        cards.forEach(function (card) {
          var delay = parseInt(card.dataset.delay || '0', 10);
          setTimeout(function () { card.classList.add('visible'); }, delay);
        });
      }, 2500);

      buildPreviewCarousel();
      setPreview(0);
      if (previewShowcase) {
        previewShowcase.addEventListener('mouseenter', function () { previewPaused = true; });
        previewShowcase.addEventListener('mouseleave', function () { previewPaused = false; });
        previewShowcase.addEventListener('focusin', function () { previewPaused = true; });
        previewShowcase.addEventListener('focusout', function () { previewPaused = false; });
      }
      if (previewPrev) previewPrev.addEventListener('click', showPreviousPreview);
      if (previewNext) previewNext.addEventListener('click', showNextPreview);
      setInterval(function () {
        if (!previewPaused) showNextPreview();
      }, 5000);
      setTimeout(showTip, 3500);
      setInterval(showTip, 12000);
      pollStatus();
      setInterval(pollStatus, 30000);
    })();
  </script>
</body>
</html>
