<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile app plan</title>
  <style>
    :root{font-family:Avenir Next,Segoe UI,sans-serif;color:#10243b;background:#eef2f6}body{margin:0}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}nav{background:#0a4f8f;color:white;padding:28px 18px;position:sticky;top:0;height:100vh}nav h1{font-size:20px;margin:0 0 24px}nav a{display:block;color:#d6e4f2;text-decoration:none;padding:9px 0}main{padding:28px;max-width:1100px}.section{background:white;border-radius:8px;padding:20px;margin-bottom:18px;border:1px solid #d5dee6}h2{font-size:22px;margin:0 0 14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e6eaf0;vertical-align:top}.dropped{color:#8a3200;background:#fff3df;padding:10px;border-left:4px solid #ca5010}.ready{color:#0b4d2c}.state{font-family:ui-monospace,monospace}.issue{border-left:4px solid #c4314b;padding-left:10px}.muted{color:#526579}button{border:0;background:#0a4f8f;color:white;padding:8px 12px;border-radius:4px;cursor:pointer}input,select{padding:7px;border:1px solid #b8c4d1;border-radius:4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:720px){.shell{grid-template-columns:1fr}nav{height:auto;position:static}}
  </style>
</head>
<body><div class="shell"><nav><h1>App plan</h1><a href="#understood">What I understood</a><a href="#model">Data model</a><a href="#native">Native capabilities</a><a href="#connectors">Connectors</a><a href="#screens">Screen map</a><a href="#progress">Progress</a><a href="#issues">Issues</a></nav><main id="app">Loading plan...</main></div>
<script>
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(url,value){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});const result=await response.json();if(!result.ok){alert(result.blocks?.map(x=>x.screen+': '+x.reason).join('\n')||result.error);return}render(result.state)}
function capability(items){return items.length?items.map(x=>`<div class="${x.state}">[${x.state}] ${esc(x.text)}${x.reason?`<div class="muted">${esc(x.reason)}</div>`:''}</div>`).join(''):'<div class="muted">None</div>'}
function render(s){document.querySelector('#app').innerHTML=`
<section class="section" id="understood"><h2>What I understood</h2><pre>${esc(s.brief)}</pre></section>
<section class="section" id="model"><h2>Data model</h2>${s.model.map(e=>`<h3>${esc(e.displayName||e.logicalName)}</h3><table><tr><th>Field</th><th>Type</th><th>Actions</th></tr>${(e.columns||[]).map(f=>`<tr><td>${esc(f.logicalName)}</td><td>${esc(f.type)}</td><td class="row"><input id="rename-${esc(e.logicalName)}-${esc(f.logicalName)}" value="${esc(f.logicalName)}"><button onclick="post('/panel/model',{op:'rename',entity:'${esc(e.logicalName)}',field:'${esc(f.logicalName)}',value:document.querySelector('#rename-${esc(e.logicalName)}-${esc(f.logicalName)}').value})">Rename</button><select id="type-${esc(e.logicalName)}-${esc(f.logicalName)}">${['string','memo','integer','decimal','money','boolean','choice','datetime','lookup','image','file'].map(type=>`<option ${type===f.type?'selected':''}>${type}</option>`).join('')}</select><button onclick="post('/panel/model',{op:'retype',entity:'${esc(e.logicalName)}',field:'${esc(f.logicalName)}',value:document.querySelector('#type-${esc(e.logicalName)}-${esc(f.logicalName)}').value})">Retype</button><button onclick="post('/panel/model',{op:'drop',entity:'${esc(e.logicalName)}',field:'${esc(f.logicalName)}})">Drop</button></td></tr>`).join('')}</table><div class="row"><input id="add-name-${esc(e.logicalName)}" placeholder="logicalName"><input id="add-label-${esc(e.logicalName)}" placeholder="Display name"><select id="add-type-${esc(e.logicalName)}">${['string','memo','integer','decimal','money','boolean','datetime'].map(type=>`<option>${type}</option>`).join('')}</select><button onclick="post('/panel/model',{op:'add',entity:'${esc(e.logicalName)}',value:{logicalName:document.querySelector('#add-name-${esc(e.logicalName)}').value,displayName:document.querySelector('#add-label-${esc(e.logicalName)}').value,type:document.querySelector('#add-type-${esc(e.logicalName)}').value}})">Add field</button></div>`).join('')}</section>
<section class="section" id="native"><h2>Native capabilities</h2>${capability(s.native)}</section>
<section class="section" id="connectors"><h2>Connectors</h2>${capability(s.connectors)}</section>
<section class="section" id="screens"><h2>Screen map</h2><table><tr><th>Screen</th><th>Purpose</th><th>Data</th><th>Pattern</th><th>Archetype</th><th></th></tr>${s.screens.map(x=>`<tr><td>${esc(x.Screen)}</td><td>${esc(x.Purpose)}</td><td>${esc(x.Data)}</td><td>${esc(x.Pattern||'')}</td><td>${esc(x.Archetype)}</td><td><button onclick="post('/panel/screens',{op:'remove',id:'${esc(x.id)}'})">Remove</button></td></tr>`).join('')}</table></section>
<section class="section" id="progress"><h2>Progress</h2>${s.progress.map(x=>`<div class="state">${esc(x.state)} - ${esc(x.label||x.id)}</div>`).join('')||'<div class="muted">Waiting for screens</div>'}</section>
<section class="section" id="issues"><h2>Issues</h2>${s.issues.map(x=>`<div class="issue"><strong>${esc(x.state)}</strong> ${esc(x.screen||'app')} - ${esc(x.actual||x.check||'')}</div>`).join('')||'<div class="muted">No issues yet</div>'}</section>`}
async function load(){render(await (await fetch('/panel/state')).json())}load();const source=new EventSource('/build/events');source.onmessage=load;
</script></body></html>
